name: Medzoomer
description: >-
  Medzoomer is an on-demand prescription delivery platform that connects
  pharmacies, healthcare providers, and patients through a secure, HIPAA-compliant
  network of verified couriers. Founded in 2019 and headquartered in Tampa,
  Florida, the company handles last-mile medication logistics, including controlled
  substances (Schedule II-V), with tamper-evident packaging, FDA/TSA-approved
  envelopes, and real-time order tracking. Pharmacies and couriers operate through
  dedicated web and mobile applications, and the platform is backed by Techstars,
  UnitedHealthcare Accelerator, and other investors. Medzoomer operates a private
  pharmacy integration API but publishes no public developer documentation, SDKs,
  or OpenAPI at this time.
